
# Only advisories that actually fire may appear here: an entry the scan does not
# report is echoed back as an unused ignore, so this list is pruned to what
# osv-scanner needs rather than mirrored from VULNCHECK_IGNORE.
#
# These five are the golang.org/x/net HTTP/2 advisories, fixed only by Go 1.27.2
# together with x/net v0.60.0 — and that Go bump is not adoptable here (errcheck
# v1.20.0 cannot read 1.27.2 export data; see the exit condition above
# VULNCHECK_IGNORE in Makefile.precommit). The stdlib-only advisories govulncheck
# reports are absent on purpose: osv-scanner reads go.mod/go.sum, does not see
# them, and listing them would produce unused-ignore noise.
#
# The three containerd entries that used to sit here (GO-2026-5064, -5338, -5622)
# were dropped on the v2.6.0 bump, which no longer reports them.

